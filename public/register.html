<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regisztráció - Futási Napló</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <div class="form-wrapper">
            <h1>Regisztráció</h1>
            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Felhasználónév:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Jelszó:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="gender">Nem:</label>
                    <select id="gender" name="gender" required>
                        <option value="">Válassz nemet</option>
                        <option value="male">Férfi</option>
                        <option value="female">Nő</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="birth_year">Születési dátum:</label>
                    <input type="date" id="birth_year" name="birth_year" required>
                </div>
                <button type="submit" class="btn">Regisztráció</button>
                <div id="message" class="message"></div>
            </form>
            <p class="switch-form">Már van fiókod? <a href="login.html">Bejelentkezés</a></p>
        </div>
    </div>
    <script src="js/client.js"></script>
</body>
</html>
