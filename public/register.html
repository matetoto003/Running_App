<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Running App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <h1 class="auth-title">Running App</h1>
        <div class="card registration-card">
            <p class="welcome-text">Join our running community!</p>
            <h2>Create Account</h2>
                    <form id="registerForm" class="registration-form">
                        <div class="form-group">
                            <label for="username">Username</label>
                            <input type="text" id="username" name="username" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" required>
                        </div>
                        <div class="form-group">
                            <label for="gender">Gender</label>
                            <select id="gender" name="gender" required>
                                <option value="">Choose gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="birth_year">Birth Date</label>
                            <input type="date" id="birth_year" name="birth_year" required>
                        </div>
                        <div id="message" class="message"></div>
                        <button type="submit" class="submit-button">Sign Up</button>
                        <p class="auth-switch">Already have an account? <a href="login.html">Sign In</a></p>
                    </form>
                </div>
    </div>
    <script src="js/client.js"></script>
</body>
</html>
