<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bejelentkezés - Running App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <h1 class="auth-title">Running App</h1>
        <div class="card login-card">
            <p class="welcome-text">Welcome back!</p>
            <h2>Sign In</h2>
                    <form id="loginForm" class="login-form">
                        <div class="form-group">
                            <label for="username">Felhasználónév</label>
                            <input type="text" id="username" name="username" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Jelszó</label>
                            <input type="password" id="password" name="password" required>
                        </div>
                        <div id="message" class="message"></div>
                        <button type="submit" class="submit-button">Bejelentkezés</button>
                        <p class="auth-switch">Nincs még fiókod? <a href="register.html">Regisztráció</a></p>
                    </form>
                </div>
    </div>
    <script src="js/client.js"></script>
</body>
</html>
