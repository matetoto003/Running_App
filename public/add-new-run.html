<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Run - Running App</title>
    <link rel="stylesheet" href="css/style.css">
    </head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">Running app</div>
            
            <nav class="main-nav">
                <h3 class="nav-title">Discover</h3>
                <ul class="nav-list">
                    <li><a href="index.html" class="nav-item">Home</a></li>
                    <li><a href="dashboards.html" class="nav-item">Dashboards</a></li>
                    <li><a href="add-new-run.html" class="nav-item active">Add new run</a></li>
                    <li><a href="training-plan.html" class="nav-item">Training plan</a></li>
                    <li><a href="useful-informations.html" class="nav-item">Useful informations</a></li>
                </ul>
            </nav>
        </aside>

        <main class="content-area">
            <header class="topbar">
                <span class="greeting">Hey <span class="username">Tamás</span>!</span>
                <div class="user-profile">
                    <button id="profileButton" class="profile-button">Profil ▼</button>
                    <div id="profileMenu" class="profile-menu">
                        <a href="#" id="logoutButton">Kijelentkezés</a>
                    </div>
                </div>
            </header>
            
            <section class="page-content">
                <h2>Add new run!</h2>
                
                <form class="run-form" id="addNewRunForm">
                    
                    <div class="form-group">
                        <label for="distance">km</label>
                        <input type="number" id="distance" name="distance" placeholder="10.1" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label for="minutes">minutes</label>
                        <input type="text" id="minutes" name="minutes" placeholder="42:10" pattern="[0-9]{1,3}:[0-5][0-9]" title="Kérlek, 'perc:másodperc' formátumot használj (pl. 42:10)" required>
                    </div>

                    <div class="form-group">
                        <label for="difficulty">difficulty (1-10)</label>
                        <input type="number" id="difficulty" name="difficulty" placeholder="8" min="1" max="10" required>
                    </div>

                    <div class="form-group">
                        <label for="avg_heartRate">Average Heart Rate (bpm)</label>
                        <input type="number" id="avg_heartRate" name="avg_heartRate" placeholder="145" required>
                    </div>

                    <div class="form-group">
                        <label for="calories">calories burnt</label>
                        <input type="number" id="calories" name="calories" placeholder="500" required>
                    </div>

                    <div class="form-group">
                        <label for="elevation">elevation gained</label>
                        <input type="text" id="elevation" name="elevation" placeholder="10m" required>
                    </div>

                    <button type="submit" class="submit-button">Save Run</button>
                    <p class="form-message" id="responseMessage"></p>
                </form>
            </section>
            </main>
    </div>
    <script src="js/client.js"></script>
    </body>
</html>
